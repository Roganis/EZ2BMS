name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # The oracle CLI lets chart-core tests compare against EZ2PORT's own code.
      - run: cargo build -p ez2port-oracle --release
      - run: pnpm test
        env:
          EZ2PORT_ORACLE: ${{ github.workspace }}/target/release/ez2port-oracle
      - run: pnpm --filter @ez2bms/editor exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/editor/test-results

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # ALSA headers, for the audio crate's real-device backend (cpal).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test
      - run: cargo build -p ez2bms-audio --features cpal

  # The two crates that run on the owner's Windows machines: audio (WASAPI
  # through cpal) and the ez2play launcher (CREATE_NO_WINDOW).
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p ez2bms-audio -p ez2bms-launch
      - run: cargo build -p ez2bms-audio --features cpal
