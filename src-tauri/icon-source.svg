<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- EZ2BMS app icon: a turntable disc over five lanes, in the editor's
       lane colours. Original artwork; nothing from the game. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#1a2240"/>
      <stop offset="1" stop-color="#05060a"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58e1ff"/>
      <stop offset="1" stop-color="#ff4fd8"/>
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="200" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="200" fill="none" stroke="#58e1ff" stroke-opacity="0.35" stroke-width="12"/>
  <g opacity="0.9">
    <rect x="232" y="560" width="88" height="300" rx="20" fill="#f2f2ff"/>
    <rect x="344" y="620" width="88" height="240" rx="20" fill="#4d9eff"/>
    <rect x="456" y="520" width="88" height="340" rx="20" fill="#f2f2ff"/>
    <rect x="568" y="600" width="88" height="260" rx="20" fill="#4d9eff"/>
    <rect x="680" y="580" width="88" height="280" rx="20" fill="#f2f2ff"/>
  </g>
  <circle cx="512" cy="400" r="250" fill="#0b0e17" stroke="url(#ring)" stroke-width="44"/>
  <circle cx="512" cy="400" r="170" fill="none" stroke="#ed2e2e" stroke-width="18" stroke-dasharray="60 34"/>
  <circle cx="512" cy="400" r="54" fill="#ffd11f"/>
</svg>
