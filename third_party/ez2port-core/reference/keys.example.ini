; EZ2PORT key bindings.  Pass with --keys, or set EZ2_KEYS.
;
; This is NOT the game's key map. Each mode's .gds already says which key
; drives which lane, and the turntable really is two inputs onto one lane by
; the game's own descriptor. This file is the layer below that: which key on
; YOUR keyboard raises each channel. See port/ez2/keyconf.h.
;
; Names are SDL scancode names, and not always the obvious word - the
; semicolon key is ";" and must be QUOTED, because ; also starts a comment.
; Run with a wrong name and the tool tells you which one it did not know.
;
; A channel may list up to four alternates. An empty value unbinds it.

[Keys]
; PLAYER 1 - five buttons across two rows, bottom Z X C and top S D.
Key1     = Z
Key2     = S
Key3     = X
Key4     = D
Key5     = C
Key6     = V            ; 7-key layouts only
Key7     = B
Scratch1 = Left Ctrl    ; the turntable, one direction
Scratch2 = Left Shift   ; and the other - both reach the same lane
Pedal    = Space
Start    = Return

; THE EFFECTOR ROW, between the two hands.
Effect1  = F
Effect2  = G
Effect3  = H
Effect4  = J

; PLAYER 2 - the mirror of player 1: bottom M , . and top K L.
; `,` is the alternates separator and `;` starts a comment, so both must be
; QUOTED here even though they need nothing in the code's own default table.
P2Key1   = M
P2Key2   = K
P2Key3   = ","
P2Key4   = L
P2Key5   = "."
P2Key6   = "/"          ; 7-key layouts only
P2Key7   = ";"
P2Scratch1 = Right Ctrl
P2Scratch2 = Right Shift
P2Pedal    = Right Alt
P2Start    = "\"          ; the backslash key

; The cabinet's two OPERATOR buttons - input 1 TEST and input 2 SERVICE.
; TEST opens the operator menu from the attract screen and leaves any of its
; pages; SERVICE steps the selected row. Both are the game's own inputs (every
; test page guards its body on `getState(1) != 2`), not port additions.
Test    = F1
Service = F2
; The coin input - cabinet slot 3, which the original itself binds to F3 on a
; keyboard. It bumps the credit counter; SERVICE does too. In free play one
; pulse in the machine's life is enough (the title polls START only once the
; counter is non-zero), in coin mode every credit needs CreditCoins of them.
Coin    = F3
